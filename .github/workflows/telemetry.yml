name: Refresh profile telemetry

on:
  schedule:
    - cron: "17 3 * * *"      # every day, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/telemetry.yml"

permissions:
  contents: write

concurrency:
  group: telemetry
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Repaint the dot portrait
        run: python scripts/make_terminal_portrait.py assets/avatar.png assets/terminal-portrait.svg

      - name: Rebuild the telemetry panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/make_telemetry.py

      - name: Commit the refreshed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/terminal-portrait.svg assets/telemetry.svg assets/activity-graph.svg assets/language-spectrum.svg assets/telemetry-data.json
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore(telemetry): refresh profile panels"
            git push
          fi
