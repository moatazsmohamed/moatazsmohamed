<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Thanks for stopping by — Moataz Mohamed, Alexandria, Egypt"><defs><linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="0.6" stop-color="#120E24"/><stop offset="1" stop-color="#0B1220"/></linearGradient><linearGradient id="fw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.8"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient><style>text{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}.fname{font-size:26px;font-weight:800;letter-spacing:7px}.ftag{font-size:13px;letter-spacing:3px}.fmeta{font-size:11.5px;letter-spacing:2.2px}@keyframes drift{0%{transform:translateX(-40px)}50%{transform:translateX(40px)}100%{transform:translateX(-40px)}}.w{animation:drift 16s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect width="1200" height="150" fill="url(#fbg)"/><g class="w"><path d="M-60 130 C 200 108, 420 152, 660 124 S 1060 104, 1280 134" fill="none" stroke="url(#fw)" stroke-width="2"/><path d="M-60 144 C 220 126, 440 166, 680 140 S 1080 122, 1280 148" fill="none" stroke="url(#fw)" stroke-width="1.2" stroke-opacity="0.55"/></g><text class="fname" x="600.0" y="62" text-anchor="middle" fill="#22D3EE">MOATAZ MOHAMED</text><text class="ftag" x="600.0" y="86" text-anchor="middle" fill="#8B949E">FRONTEND DEVELOPER · ARABIC-FIRST</text><text class="fmeta" x="600.0" y="108" text-anchor="middle" fill="#8B949E" opacity="0.75">ALEXANDRIA, EGYPT · THANKS FOR STOPPING BY</text></svg>